<style>

*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}button,input,select{font:inherit}button{cursor:pointer;border:0}.hidden{display:none!important}
.top{background:#0f172a;color:#fff;position:sticky;top:0;z-index:20;padding:13px 17px;box-shadow:0 4px 18px #0002}.topin{max-width:1180px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-weight:900;font-size:18px}.brand small{display:block;color:#cbd5e1;font-size:11px;font-weight:500}
.wrap{max-width:1180px;margin:auto;padding:18px}.login{min-height:100vh;display:grid;place-items:center;padding:18px;background:linear-gradient(135deg,#0f172a,#1e3a8a)}.loginbox{width:min(450px,100%);background:#fff;border-radius:24px;padding:26px;box-shadow:0 25px 70px #0005}.logo{width:60px;height:60px;border-radius:18px;background:#dbeafe;display:grid;place-items:center;font-size:30px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);box-shadow:var(--shadow);padding:17px}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.cards3{grid-template-columns:repeat(3,1fr)}
.stat .label{font-size:13px;color:var(--muted)}.stat .val{font-size:26px;font-weight:900;margin-top:4px}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:15px}.tab{padding:10px 14px;border-radius:12px;background:#e9eef6;color:#334155;white-space:nowrap;font-weight:700}.tab.active{background:var(--primary);color:#fff}
.btn{padding:10px 14px;border-radius:11px;font-weight:800}.primary{background:var(--primary);color:#fff}.success{background:var(--success);color:#fff}.warning{background:var(--warning);color:#fff}.danger{background:var(--danger);color:#fff}.light{background:#edf2f7;color:#334155}.btn:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:8px;flex-wrap:wrap}.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:13px}.title h2,.title h3{margin:0}.muted{color:var(--muted)}.notice{padding:12px 14px;border-radius:13px;background:#eff6ff;color:#1e40af;font-size:13px}.warn{padding:12px 14px;border-radius:13px;background:#fff7ed;color:#9a3412;font-size:13px}.ok{padding:12px 14px;border-radius:13px;background:#f0fdf4;color:#166534;font-size:13px}

.clock{font-size:42px;font-weight:950;letter-spacing:1px}.employee{max-width:720px;margin:auto}.earn{background:linear-gradient(135deg,#172554,#2563eb);color:#fff;border:0}.earn .muted{color:#dbeafe}.mot{padding:13px;border-radius:13px;background:#f0fdf4;color:#166534;border:1px solid #bbf7d0;margin-top:14px}.center{text-align:center}.empty{text-align:center;padding:32px;color:var(--muted)}.toast{position:fixed;right:18px;bottom:18px;z-index:100;background:#111827;color:#fff;padding:13px 16px;border-radius:13px;box-shadow:var(--shadow);max-width:340px}

@media(max-width:850px){.stats{grid-template-columns:1fr 1fr}.cards3{grid-template-columns:1fr 1fr}}
@media(max-width:600px){.wrap{padding:12px}.stats,.cards3,.form2{grid-template-columns:1fr}.card{padding:14px}.clock{font-size:34px}}

/* ---------- Online-only gate ---------- */
#networkGate{position:fixed;inset:0;z-index:99999;background:rgba(248,250,252,.98);display:none;align-items:center;justify-content:center;padding:20px;text-align:center}
#networkGate.show{display:flex}
.networkBox{width:min(460px,100%);background:#fff;border:1px solid #e2e8f0;border-radius:24px;padding:28px 22px;box-shadow:0 20px 60px rgba(15,23,42,.14)}
.networkIcon{font-size:54px;margin-bottom:10px}.networkBox h2{margin:0 0 8px}.networkBox p{color:#64748b;line-height:1.7;margin:0 0 18px}.netStatus{display:inline-flex;align-items:center;gap:7px;padding:8px 12px;border-radius:999px;background:#fee2e2;color:#991b1b;font-weight:800;font-size:13px}.netStatus.ok{background:#dcfce7;color:#166534}
.netBar{position:fixed;left:0;right:0;top:0;z-index:99998;padding:7px 12px;text-align:center;font-size:12px;font-weight:800;background:#fee2e2;color:#991b1b;display:none}.netBar.show{display:block}.netBar.ok{background:#dcfce7;color:#166534}

<div id="app"></div>
<div id="netBar" class="netBar"></div>
<div id="networkGate" aria-live="polite"><div class="networkBox">

  <div id="networkStatus" class="netStatus">🔴 ইন্টারনেট নেই</div>
  <div class="muted" style="margin-top:16px;font-size:12px">ইন্টারনেট সংযোগ ফিরে এলে এই পেজ স্বয়ংক্রিয়ভাবে আবার চালু হবে।</div>
</div></div><div id="toast" class="toast hidden"></div>

<script>

   ========================================================= */

const FIREBASE_CONFIG={
  apiKey:"AIzaSyBxm00Kp42MNclCIAD3PS4TA2bH12WPlbc",
  authDomain:"vinnata-telecom-plus.firebaseapp.com",
  projectId:"vinnata-telecom-plus",
  storageBucket:"vinnata-telecom-plus.firebasestorage.app",
  messagingSenderId:"754121291723",
  appId:"1:754121291723:web:9f676a026038cd860b284e",
  measurementId:"G-CV5KG9LGYZ"
};

/* IMPORTANT:
   Put YOUR Firebase Auth admin user's UID here after checking
   Firebase Console > Authentication > Users.
   Do not use email as a security rule.
*/
const ADMIN_UID="miuScKc2ldNp6TfwLl5l5YPYLC82";

const firebaseApp=firebase.initializeApp(FIREBASE_CONFIG);
const auth=firebase.auth();
const db=firebase.firestore();
const adminApp=firebase.initializeApp(FIREBASE_CONFIG,"employeeCreator");
const adminAuth=adminApp.auth();

const app=document.getElementById("app");
const networkGate=document.getElementById("networkGate"),netBar=document.getElementById("netBar"),networkStatus=document.getElementById("networkStatus");
let networkOK=navigator.onLine;
let networkCheckTimer=null;
let user=null, profile=null, mode=null, tab="dashboard", unsub=[], tick=null;

const $=id=>document.getElementById(id);
const money=n=>"৳"+Number(n||0).toFixed(2);
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+"_"+Math.random().toString(36).slice(2);
const fmtDate=ts=>ts?new Date(ts).toLocaleString("bn-BD",{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}):"-";
const dur=ms=>{ms=Math.max(0,ms||0);let s=Math.floor(ms/1000),h=Math.floor(s/3600);s%=3600;let m=Math.floor(s/60),x=s%60;return `${String(h).padStart(2,"0")}h ${String(m).padStart(2,"0")}m ${String(x).padStart(2,"0")}s`};
const hours=ms=>ms/3600000;
const toast=m=>{let t=$("toast");t.textContent=m;t.classList.remove("hidden");clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add("hidden"),3000)};
const statusBadge=st=>({working:'<span class="status work"><span class="dot"></span>🟢 Working</span>',break:'<span class="status break"><span class="dot"></span>☕ Break</span>',off:'<span class="status off"><span class="dot"></span>⚪ Offline</span>'}[st]||'<span class="status off">Offline</span>');
const initial=n=>(n||"?").trim().split(/\s+/).slice(0,2).map(x=>x[0]).join("").toUpperCase();

function setNetworkUI(ok){
 networkOK=!!ok;
 networkGate.classList.toggle("show",!networkOK);
 netBar.classList.toggle("show",!networkOK);
 netBar.classList.toggle("ok",networkOK);
 netBar.textContent=networkOK?"🟢 Internet Connected":"🔴 Internet connection lost • Software paused";
 networkStatus.classList.toggle("ok",networkOK);
 networkStatus.textContent=networkOK?"🟢 Internet Connected":"🔴 ইন্টারনেট নেই";
}
function requireOnline(){
 if(!navigator.onLine){setNetworkUI(false);return false}
 return networkOK;
}
async function checkInternet(){
 if(!navigator.onLine){setNetworkUI(false);return false}
 try{
   const controller=new AbortController();
   const timer=setTimeout(()=>controller.abort(),5000);
   await fetch("https://www.gstatic.com/generate_204?ts="+Date.now(),{cache:"no-store",mode:"no-cors",signal:controller.signal});
   clearTimeout(timer); setNetworkUI(true); return true;
 }catch(e){setNetworkUI(false);return false}
}
async function handleOffline(){
 setNetworkUI(false); cleanup();
}
async function handleOnline(){
 const ok=await checkInternet();
 if(ok){
   if(user&&mode){render();}
   else{auth.currentUser?null:renderLogin()}
 }
}
window.addEventListener("offline",handleOffline);
window.addEventListener("online",handleOnline);
checkInternet();
networkCheckTimer=setInterval(checkInternet,15000);

function cleanup(){unsub.forEach(x=>x&&x());unsub=[];clearInterval(tick);tick=null}
function goLogin(){cleanup();user=null;profile=null;mode=null;renderLogin()}
function errorText(e){
  if(e.code==="auth/wrong-password"||e.code==="auth/invalid-credential")return "Email অথবা Password সঠিক নয়।";
  if(e.code==="auth/user-not-found")return "এই Account পাওয়া যায়নি।";
  if(e.code==="auth/email-already-in-use")return "এই Email দিয়ে Account আগে থেকেই আছে।";
  if(e.code==="auth/weak-password")return "Password কমপক্ষে 6 অক্ষরের দিন।";
  if(e.code==="permission-denied")return "Firebase Security Rules অনুমতি দিচ্ছে না।";
  return e.message||"একটি সমস্যা হয়েছে।";
}

function renderLogin(){
 app.innerHTML=`<div class="login"><div class="loginbox">
   <div class="logo">📡</div><h1 style="margin:0 0 4px">ভিন্নতা টেলিকম প্লাস</h1><p class="muted">Employee Time & Salary System v1.1</p>
   <div class="notice">☁️ Firebase Cloud Version<br>Admin ও Employee আলাদা Login ব্যবহার করবে।<br><b>🌐 Active Internet Connection Required</b></div>
   <div class="actions" style="margin-top:16px"><button class="btn primary" style="flex:1" onclick="showLogin('admin')">👑 Admin Login</button><button class="btn light" style="flex:1" onclick="showLogin('employee')">👨‍💼 Employee Login</button></div>
   <div class="footer">Cloud data is protected by Firebase Authentication + Firestore Rules.</div>
 </div></div>`;
}
function showLogin(which){
 app.innerHTML=`<div class="login"><div class="loginbox">
   <div class="logo">${which==="admin"?"👑":"👨‍💼"}</div><h2>${which==="admin"?"Admin Login":"Employee Login"}</h2>
   <div class="field"><label>Email</label><input id="loginEmail" type="email" autocomplete="username"></div>
   <div class="field"><label>Password</label><input id="loginPass" type="password" autocomplete="current-password"></div>
   <div class="actions"><button class="btn primary" style="flex:1" onclick="login('${which}')">Login</button><button class="btn light" onclick="renderLogin()">Back</button></div>
   ${which==="admin"?'<div class="warn" style="margin-top:14px">Admin Account আগে Firebase Authentication-এ তৈরি করা হয়েছে।</div>':''}
 </div></div>`;
}
async function login(which){
 if(!await checkInternet()){toast("ইন্টারনেট সংযোগ ছাড়া Login করা যাবে না।");return}
 try{
  const cred=await auth.signInWithEmailAndPassword($("loginEmail").value.trim(),$("loginPass").value);
  user=cred.user;
  if(which==="admin" && (ADMIN_UID==="PASTE_ADMIN_UID_HERE" || user.uid!==ADMIN_UID)){await auth.signOut();toast(ADMIN_UID==="PASTE_ADMIN_UID_HERE"?"প্রথমে HTML-এ Admin UID বসাতে হবে।":"এই Account Admin নয়।");return}
  const snap=await db.collection("employees").doc(user.uid).get();
  profile=snap.exists?snap.data():null;
  if(which==="employee" && (!profile||profile.active===false)){await auth.signOut();toast("Employee profile পাওয়া যায়নি বা inactive।");return}
  mode=which==="admin"?"admin":"employee";
  render();
 }catch(e){toast(errorText(e))}
}
async function logout(){await auth.signOut();goLogin()}

/* ---------- calculations ---------- */
function activeSessionFor(uid){
 return window._sessions?.find(s=>s.employeeId===uid&&!s.endAt)||null;
}
function activeMySession(uid){
 return window._mySessions?.find(s=>s.employeeId===uid&&!s.endAt)||null;
}
function tsMs(v){return v?.toMillis?v.toMillis():Number(v||0)}
function verificationState(s){
 if(!s||s.endAt)return {due:false,grace:false,expired:false,remaining:0};
 const start=tsMs(s.startAt), last=tsMs(s.lastVerificationAt)||start;
 const interval=(window._settings?.verificationIntervalMinutes||60)*60000;
 const grace=(window._settings?.verificationGraceMinutes||15)*60000;
 const dueAt=last+interval, now=Date.now();
 return {due:now>=dueAt,grace:now>=dueAt&&now<dueAt+grace,expired:now>=dueAt+grace,remaining:Math.max(0,dueAt+grace-now),dueAt};
}
function calc(s,e){
 const end=s.endAt?s.endAt.toMillis? s.endAt.toMillis():s.endAt:Date.now();
 const start=s.startAt?.toMillis?s.startAt.toMillis():s.startAt;
 let ms=end-start-(s.breakMs||0);
 if(s.breakStart){const bs=s.breakStart.toMillis?s.breakStart.toMillis():s.breakStart;ms-=Date.now()-bs}
 ms=Math.max(0,ms);
 const target=(window._settings?.targetHours||8)*3600000;
 const reg=Math.min(ms,target),ot=Math.max(0,ms-target);
 return {ms,reg,ot,regularPay:hours(reg)*Number(e.rate||0),otPay:hours(ot)*Number(e.otRate||0)};
}
function totalEarned(uid,e,sessions){
 return sessions.filter(s=>s.employeeId===uid).reduce((a,s)=>{let c=calc(s,e);return a+c.regularPay+c.otPay},0)
}
function activeStatus(s){return !s?"off":s.breakStart?"break":"working"}

/* ---------- Admin ---------- */
function renderAdmin(){
 cleanup();
 tab=tab||"dashboard";
 app.innerHTML=`<header class="top"><div class="topin"><div class="brand">📡 ভিন্নতা টেলিকম প্লাস<small>Owner Control Panel</small></div><button class="btn light" onclick="logout()">Logout</button></div></header>
 <main class="wrap"><div class="tabs">
 ${["dashboard","employees","reports","payments","settings"].map(x=>`<button class="tab ${tab===x?"active":""}" onclick="tab='${x}';renderAdmin()">${({dashboard:"📊 Dashboard",employees:"👥 Employees",reports:"📋 Reports",payments:"💳 Payments",settings:"⚙️ Settings"})[x]}</button>`).join("")}</div>
 <div id="adminContent"></div><div class="footer">v1.2 Trial • Firebase Cloud</div></main>`;
 subscribeAdmin();
}
function subscribeAdmin(){
 let empUn=()=>{},sesUn=()=>{},payUn=()=>{},setUn=()=>{};
 empUn=db.collection("employees").where("active","==",true).onSnapshot(s=>{window._employees=s.docs.map(d=>({id:d.id,...d.data()}));paintAdmin()},e=>toast(errorText(e)));
 sesUn=db.collection("sessions").onSnapshot(s=>{window._sessions=s.docs.map(d=>({id:d.id,...d.data()}));paintAdmin()},e=>console.warn(e));
 payUn=db.collection("payments").onSnapshot(s=>{window._payments=s.docs.map(d=>({id:d.id,...d.data()}));paintAdmin()},e=>console.warn(e));
 setUn=db.collection("settings").doc("main").onSnapshot(s=>{window._settings=s.exists?s.data():{shopName:"ভিন্নতা টেলিকম প্লাস",targetHours:8,whatsappNumber:"",verificationIntervalMinutes:60,verificationGraceMinutes:15};paintAdmin()},e=>console.warn(e));
 unsub=[empUn,sesUn,payUn,setUn];tick=setInterval(paintAdmin,1000);
}
function paintAdmin(){
 if(!user||mode!=="admin")return;
 const c=$("adminContent");if(!c)return;
 const es=window._employees||[],ss=window._sessions||[],ps=window._payments||[],settings=window._settings||{targetHours:8,verificationIntervalMinutes:60,verificationGraceMinutes:15};
 if(tab==="dashboard")c.innerHTML=adminDashboard(es,ss,ps,settings);
 if(tab==="employees")c.innerHTML=adminEmployees(es,ss);
 if(tab==="reports")c.innerHTML=adminReports(es,ss);
 if(tab==="payments")c.innerHTML=adminPayments(es,ps,ss);
 if(tab==="settings")c.innerHTML=adminSettings(settings);
}
function adminDashboard(es,ss,ps,settings){
 const working=es.filter(e=>activeStatus(activeSessionFor(e.id))==="working").length,br=es.filter(e=>activeStatus(activeSessionFor(e.id))==="break").length,locked=es.filter(e=>e.workLocked).length;
 const earned=es.reduce((a,e)=>a+totalEarned(e.id,e,ss),0),paid=ps.reduce((a,p)=>a+Number(p.amount||0),0);
 return `<div class="grid stats">
 <div class="card stat"><div class="label">Employees</div><div class="val">${es.length}</div></div><div class="card stat"><div class="label">🟢 Working</div><div class="val">${working}</div></div>
 <div class="card stat"><div class="label">☕ Break</div><div class="val">${br}</div></div><div class="card stat"><div class="label">🔒 Locked</div><div class="val">${locked}</div></div><div class="card stat"><div class="label">Total Earned</div><div class="val">${money(earned)}</div></div></div>
 <div class="card" style="margin-top:15px"><div class="title"><h2>🔴 Live Employee Status</h2><span class="muted">Cloud Live</span></div>
 <div class="grid cards3">${es.length?es.map(e=>empCard(e,ss,ps,settings)).join(""):'<div class="empty">কোনো active employee নেই।</div>'}</div></div>`;
}
function empCard(e,ss,ps,settings){
 const s=activeSessionFor(e.id),st=activeStatus(s),c=s?calc(s,e):null,earned=totalEarned(e.id,e,ss),paid=ps.filter(p=>p.employeeId===e.id).reduce((a,p)=>a+Number(p.amount||0),0),vs=s?verificationState(s):null;

async function adminStopWork(employeeId){
 const s=activeSessionFor(employeeId);

 const reason=prompt("Stop করার কারণ লিখুন:","Admin stopped after checking CCTV");
 if(reason===null)return;
 try{
  let data={endAt:firebase.firestore.FieldValue.serverTimestamp(),endReason:"admin_stop",adminStopReason:reason.trim()||"Admin stopped"};
  if(s.breakStart){data.breakMs=firebase.firestore.FieldValue.increment(Date.now()-tsMs(s.breakStart));data.breakStart=null}
  await db.collection("sessions").doc(s.id).update(data);

  toast("Work stopped এবং Employee locked 🔒");
 }catch(e){toast(errorText(e))}
}

function motivation(e,s,c,settings){

 return `<div class="mot">🔥 আপনি এখন Overtime করছেন। আরও 15 মিনিট কাজ করলে আনুমানিক <b>${money(15/60*Number(e.otRate||0))}</b> অতিরিক্ত আয় হবে।</div>`;

async function startWork(){
 if(!await checkInternet()){toast("ইন্টারনেট সংযোগ ছাড়া Work Start করা যাবে না।");return}

 if(!await checkInternet()){toast("ইন্টারনেট সংযোগ নেই।");return}
 const s=activeSessionFor(user.uid);if(!s)return;
 try{await db.collection("sessions").doc(s.id).update({breakStart:firebase.firestore.FieldValue.serverTimestamp()});toast("Break শুরু হয়েছে ☕")}catch(e){toast(errorText(e))}
}
async function resumeWork(){
 if(!await checkInternet()){toast("ইন্টারনেট সংযোগ নেই।");return}
 const s=activeSessionFor(user.uid);if(!s||!s.breakStart)return;
 try{
  const bs=s.breakStart.toMillis?s.breakStart.toMillis():s.breakStart;
  const extra=Date.now()-bs;
  await db.collection("sessions").doc(s.id).update({breakMs:firebase.firestore.FieldValue.increment(extra),breakStart:null});
  toast("আবার কাজ শুরু হয়েছে 🟢");
 }catch(e){toast(errorText(e))}
}
async function endWork(){
 if(!await checkInternet()){toast("ইন্টারনেট সংযোগ নেই। Work End করা যাবে না।");return}
 const s=activeSessionFor(user.uid);if(!s)return;
 try{
  let data={endAt:firebase.firestore.FieldValue.serverTimestamp()};
  if(s.breakStart){let bs=s.breakStart.toMillis?s.breakStart.toMillis():s.breakStart;data.breakMs=firebase.firestore.FieldValue.increment(Date.now()-bs);data.breakStart=null}
  await db.collection("sessions").doc(s.id).update(data);toast("কাজ শেষ হয়েছে 🔴");
 }catch(e){toast(errorText(e))}
}

/* ---------- export ---------- */
function exportCSV(){
 const es=window._employees||[],ss=window._sessions||[],rows=[["Employee","Start","End","Total","Regular Pay","OT Pay","Total Pay"]];
 ss.forEach(s=>{let e=es.find(x=>x.id===s.employeeId)||{name:"Unknown",rate:0,otRate:0};let c=calc(s,e);rows.push([e.name,fmtDate(s.startAt?.toMillis?s.startAt.toMillis():s.startAt),s.endAt?fmtDate(s.endAt.toMillis?s.endAt.toMillis():s.endAt):"",dur(c.ms),c.regularPay.toFixed(2),c.otPay.toFixed(2),(c.regularPay+c.otPay).toFixed(2)])});
 const csv="\ufeff"+rows.map(r=>r.map(x=>`"${String(x).replaceAll('"','""')}"`).join(",")).join("\n"),a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download="vtt-plus-v1.2-trial-report.csv";a.click();
}

/* ---------- auth boot ---------- */
auth.onAuthStateChanged(async u=>{
 if(!networkOK){setNetworkUI(false);return}
 if(!u){renderLogin();return}
 user=u;
 try{
  const s=await db.collection("employees").doc(u.uid).get();
  profile=s.exists?s.data():null;
  if(ADMIN_UID!=="PASTE_ADMIN_UID_HERE"&&u.uid===ADMIN_UID){mode="admin";renderAdmin();return}
  if(profile&&profile.active!==false){mode="employee";renderEmployee();return}
  await auth.signOut();renderLogin();
 }catch(e){console.error(e);renderLogin()}
});
</script>
